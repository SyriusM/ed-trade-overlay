[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ed-trade-overlay"
version = "1.0.0"
description = "Trade computer for Elite Dangerous on Linux: in-game bar and TCE-style panel driven by the game journal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SyriusM" }]
requires-python = ">=3.12"
dependencies = ["requests"]
keywords = ["elite-dangerous", "trade", "overlay", "linux", "proton"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest"]
eddn = ["pyzmq"]      # live prices from EDDN (optional)
hotkeys = ["pynput"]  # global hotkeys on X11/XWayland (optional)
full = ["pyzmq", "pynput"]

[project.urls]
Homepage = "https://github.com/SyriusM/ed-trade-overlay"
Issues = "https://github.com/SyriusM/ed-trade-overlay/issues"

[project.scripts]
edto = "edtrade.main:main"

[tool.setuptools]
packages = ["edtrade"]

[tool.pytest.ini_options]
# test_gui_brief.py to ręczny test na pulpicie autora (KDE, DISPLAY :0) — nie dla CI
addopts = "-q --ignore=test_gui_brief.py"
