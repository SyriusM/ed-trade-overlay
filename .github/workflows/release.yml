name: release

# Tag v* (np. v1.0.0) → testy, paczki Pythona i samodzielny plik dla Linuksa → szkic wydania na GitHubie.
# Szkic nie jest publiczny, dopóki autor nie kliknie "Publish release".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04  # starszy glibc → binarka działa na większej liczbie dystrybucji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install build pyinstaller pytest pyzmq pynput .
      - name: Run tests
        run: xvfb-run -a python -m pytest
      - name: Build wheel and sdist
        run: python -m build
      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name edto --hidden-import zmq --hidden-import pynput edtrade/__main__.py
          mv dist/edto dist/edto-linux-x86_64
          ./dist/edto-linux-x86_64 --version
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/edto-linux-x86_64
      - name: Upload build (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ed-trade-overlay-build
          path: dist/
